name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # Native payloads. Every leg that can also run the desktop test suite against
  # the binary it just built does so, since that is what ships in the package.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade meson ninja
      - name: Build pixman
        shell: pwsh
        run: ./eng/build-natives.ps1 -Rid ${{ matrix.rid }}
      - name: Build
        run: dotnet build -c Release
      - name: Check the tests see the freshly built pixman
        shell: bash
        run: ls tests/Pixman.NET.Tests/bin/Release/net10.0/ | grep -q 'pixman-1.dll'
      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            arch: x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build pixman (manylinux_2_28 container)
        run: sh eng/build-natives.sh linux-docker ${{ matrix.arch }}
      - name: Check the glibc floor
        run: |
          set -eu
          objdump -T runtimes/${{ matrix.rid }}/native/libpixman-1.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          if objdump -T runtimes/${{ matrix.rid }}/native/libpixman-1.so | grep -oE 'GLIBC_2\.(29|[3-9][0-9])'; then
            echo "libpixman-1.so needs a glibc newer than 2.28" >&2
            exit 1
          fi
      - name: Build
        run: dotnet build -c Release
      - name: Check the tests see the freshly built pixman
        run: ls tests/Pixman.NET.Tests/bin/Release/net10.0/ | grep -q 'libpixman-1.so'
      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  android:
    name: Android natives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade meson ninja
      - name: Build pixman
        # The Ubuntu image exports ANDROID_NDK_LATEST_HOME; ANDROID_HOME/ndk is the fallback.
        run: ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}" sh eng/build-natives.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: runtimes/android-*/native/*
          if-no-files-found: error

  wasm:
    name: WebAssembly natives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade meson ninja
      # The workload carries the Emscripten release .NET 10 links with; the
      # script picks it up from DOTNET_ROOT and refuses any other version.
      - run: dotnet workload install wasm-tools
      - name: Build pixman
        run: sh eng/build-natives.sh wasm
      - uses: actions/upload-artifact@v4
        with:
          name: native-browser-wasm
          path: runtimes/browser-wasm/native/*
          if-no-files-found: error

  macos:
    name: macOS and Apple natives
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Select the newest Xcode
        run: |
          set -eu
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install meson ninja
      - name: Build pixman (macOS, universal)
        run: sh eng/build-natives.sh osx
      - name: Check both architectures are in the binary
        run: |
          set -eu
          lipo -info runtimes/osx/native/libpixman-1.0.dylib | tee /dev/stderr | grep -q arm64
          lipo -info runtimes/osx/native/libpixman-1.0.dylib | grep -q x86_64
      - name: Build pixman (iOS, tvOS, Mac Catalyst)
        run: sh eng/build-natives.sh apple
      - run: dotnet workload install ios tvos maccatalyst
      - name: Build
        run: dotnet build -c Release
      - name: Check the tests see the freshly built pixman
        run: ls tests/Pixman.NET.Tests/bin/Release/net10.0/ | grep -q 'libpixman-1.0.dylib'
      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx
          path: runtimes/osx/native/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: xcframeworks/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Package: runs on macOS because the Apple TFMs need those workloads.
  # ---------------------------------------------------------------------------
  pack:
    name: Pack with every runtime
    needs: [windows, linux, android, wasm, macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install ios tvos maccatalyst
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: staging
      - uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: xcframeworks
      - name: Lay the runtimes out
        run: |
          set -eu
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx browser-wasm; do
            mkdir -p "runtimes/$rid/native"
            cp -a "staging/native-$rid/." "runtimes/$rid/native/"
          done
          # The android artifact keeps its runtimes/<rid>/native layout.
          cp -a staging/native-android/. runtimes/
          find runtimes xcframeworks -type f | sort
      - name: Pack
        run: dotnet pack src/Pixman.NET/Pixman.NET.csproj -c Release -o artifacts
      - name: Check the package carries every payload
        run: |
          set -eu
          pkg=$(ls artifacts/*.nupkg | head -1)
          unzip -l "$pkg" | grep -E 'runtimes/|xcframeworks/|buildTransitive/|lib/' | sort
          for path in \
            runtimes/win-x64/native/pixman-1.dll \
            runtimes/win-arm64/native/pixman-1.dll \
            runtimes/linux-x64/native/libpixman-1.so \
            runtimes/linux-arm64/native/libpixman-1.so \
            runtimes/osx/native/libpixman-1.0.dylib \
            runtimes/android-arm64/native/libpixman-1.so \
            runtimes/android-x64/native/libpixman-1.so \
            runtimes/browser-wasm/native/pixman-1.a \
            xcframeworks/pixman.xcframework/Info.plist \
            buildTransitive/net10.0/pixman-dotnet.targets \
            buildTransitive/net10.0-ios26.0/pixman-dotnet.targets \
            lib/net10.0/pixman-dotnet.dll \
            lib/net10.0-ios26.0/pixman-dotnet.dll \
            lib/net10.0-tvos26.0/pixman-dotnet.dll \
            lib/net10.0-maccatalyst26.0/pixman-dotnet.dll; do
            unzip -l "$pkg" | grep -q " $path\$" || { echo "$pkg lacks $path" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Smoke tests of the packed nupkg on the platforms where pixman is bundled
  # with the app: the shared test suite runs inside a host app via XHarness.
  # ---------------------------------------------------------------------------
  test-apple:
    name: Package test (${{ matrix.platform }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, tvos, maccatalyst]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Select the newest Xcode
        run: |
          set -eu
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: dotnet workload install ios tvos maccatalyst
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: Run the suite in the simulator
        run: PIXMAN_SKIP_PACK=1 sh eng/test-natives.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.platform }}
          path: artifacts/test-results/
          if-no-files-found: ignore

  test-android:
    name: Package test (android)
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install android
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the suite in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: PIXMAN_SKIP_PACK=1 sh eng/test-natives.sh android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-android
          path: artifacts/test-results/
          if-no-files-found: ignore

  test-wasm:
    name: Package test (browser-wasm)
    needs: pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: Run the suite in headless Chrome
        # The Ubuntu image ships Chrome plus a matching chromedriver at $CHROMEWEBDRIVER.
        run: PIXMAN_SKIP_PACK=1 PIXMAN_CHROMEDRIVER_DIR="$CHROMEWEBDRIVER" sh eng/test-natives.sh wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-wasm
          path: artifacts/test-results/
          if-no-files-found: ignore

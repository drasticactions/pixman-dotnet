name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx
    runs-on: ${{ matrix.os }}
    steps:
      # Windows and macOS build pixman from the submodule and test against that
      # build, which is what ships in the package. Linux tests against the
      # distro library; the package carries no Linux payload.
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.rid != '' }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install pixman (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpixman-1-0

      - uses: actions/setup-python@v5
        if: matrix.rid != ''
        with:
          python-version: '3.12'

      - name: Install meson and ninja
        if: matrix.rid != ''
        run: python -m pip install --upgrade meson ninja

      - name: Build pixman (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/build-natives.ps1 -Rid ${{ matrix.rid }}

      - name: Build pixman (macOS, universal)
        if: runner.os == 'macOS'
        run: sh eng/build-natives.sh osx

      - name: Check both architectures are in the binary
        if: runner.os == 'macOS'
        run: |
          set -eu
          binary=$(ls runtimes/osx/native/*.dylib)
          lipo -info "$binary"
          lipo -info "$binary" | grep -q arm64
          lipo -info "$binary" | grep -q x86_64

      - name: Build
        run: dotnet build -c Release

      - name: Check the tests see the freshly built pixman
        if: matrix.rid != ''
        shell: bash
        run: |
          set -eu
          ls tests/Pixman.NET.Tests/bin/Release/net8.0/ | grep -E 'pixman-1\.dll|libpixman-1\.0\.dylib'

      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: matrix.rid != ''
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  pack:
    name: Pack with every runtime
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: staging

      - name: Lay the runtimes out
        run: |
          set -eu
          for rid in win-x64 osx; do
            mkdir -p "runtimes/$rid/native"
            cp -a "staging/native-$rid/." "runtimes/$rid/native/"
          done
          find runtimes -type f | sort

      - name: Pack
        run: dotnet pack src/Pixman.NET/Pixman.NET.csproj -c Release -o artifacts

      - name: Check the package carries both runtimes
        run: |
          set -eu
          pkg=$(ls artifacts/*.nupkg | head -1)
          unzip -l "$pkg" | grep -E 'runtimes/(win-x64|osx)/native/' | sort
          for rid in win-x64 osx; do
            unzip -l "$pkg" | grep -q "runtimes/$rid/native/" || {
              echo "$pkg carries no $rid payload" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
